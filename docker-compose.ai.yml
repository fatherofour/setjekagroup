# The Setjeka assistant's model server (2026-11-04), added to the main file:
#
#   docker compose -f docker-compose.prod.yml -f docker-compose.ai.yml up -d
#
# Ollama serves a local model (Qwen) to the backend over its
# OpenAI-compatible API, on the compose network only (no published port).
# The models live in an existing Docker volume (laid out as Ollama's
# /root/.ollama), mounted read-only so this server never changes or prunes
# them: OLLAMA_MODELS_VOLUME names it (on the
# VPS, the one the NACOL portal's Ollama downloaded them into). On a new
# server, create the volume and pull a model into it first, e.g.
#   docker volume create setjeka_ollama_models
#   docker run --rm -v setjeka_ollama_models:/root/.ollama ollama/ollama sh -c "ollama serve & sleep 5; ollama pull qwen2.5:3b"
services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      # Keep the model in memory between questions, one question at a time
      # (a CPU server has no room for two).
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NOPRUNE: "1"
      # Read from the shared volume; Ollama's own key stays in the container.
      OLLAMA_MODELS: /shared/models
    volumes:
      - ollama_models:/shared:ro
    expose:
      - "11434"

  backend:
    environment:
      AI_BASE_URL: http://ollama:11434/v1
      # qwen2.5:3b: about 40 seconds an answer on the VPS's 4 CPU cores, and
      # right when given worked-out dates (qwen3:4b thinks first: 2.5 min;
      # qwen2.5:7b: 1.5 min). Timed 2026-11-04.
      AI_MODEL: ${AI_MODEL:-qwen2.5:3b}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-240000}
    depends_on:
      ollama:
        condition: service_started

volumes:
  ollama_models:
    external: true
    name: ${OLLAMA_MODELS_VOLUME:-setjeka_ollama_models}
