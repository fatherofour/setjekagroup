# Setjeka ERP — nginx: TLS termination + reverse proxy
#
# TLS is terminated HERE in nginx, not by a Caddy proxy in front of it —
# same lesson learned deploying OpenConstructionERP on this VPS: Caddy's Go
# TLS stack reproducibly failed every handshake on this host regardless of
# cert type or Caddyfile shape, while nginx (OpenSSL-based TLS) worked
# flawlessly with the exact same certificate. See that repo's
# deploy/docker/nginx.conf for the full writeup.
#
# Unlike OpenConstructionERP's frontend (a static Vite SPA nginx could serve
# directly), this app's frontend is a Next.js server (dynamic routes like
# /projects/[id] need it) — so nginx here is a pure reverse proxy to two
# upstream Node processes, not a static file server.
#
# Certificate: self-signed today (no domain yet, raw-IP access). Generate
# with (from the repo root, on the VPS):
#   mkdir -p deploy/certs
#   openssl req -x509 -newkey rsa:2048 -keyout deploy/certs/site.key \
#     -out deploy/certs/site.crt -days 3650 -nodes -subj "/CN=<VPS_IP_or_domain>"

server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /certs/site.crt;
    ssl_certificate_key /certs/site.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Compliance document uploads, up to 20MB (matches the backend's own
    # multer limit in backend/src/compliance-records/upload.util.ts) — a
    # small margin over that so nginx never rejects what the app would
    # otherwise accept.
    client_max_body_size 25m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;

    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Next.js dev/prod hot chunks and websocket-based fast refresh use this
    # in dev only, but harmless to keep proxied generically in prod too.
    location /_next/webpack-hmr {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
